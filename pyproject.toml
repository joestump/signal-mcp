[project]
name = "signal-mcp"
version = "0.2.0"
description = "MCP server for signal-cli — send and receive Signal messages and emoji reactions via a signal-cli daemon, with a trusted-recipients allowlist."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anyio>=4.0.0",
    # Held below 4.0 deliberately: that release moves the task subsystem out to
    # a separate fastmcp-tasks package and changes internals this depends on
    # (ResourceTemplate._read loses task_meta). Worth its own upgrade PR, not a
    # version bump — see the 4.0 note on tools._a2ui_result.
    "fastmcp>=3.4.7,<4",
    # fastmcp vendors nothing — it builds on the official SDK, which
    # signal_mcp.channel imports directly (mcp.server.stdio, mcp.types).
    # Declared explicitly rather than leaned on transitively.
    "mcp>=1.29.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
signal-mcp = "signal_mcp.main:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.34.0",
]
test = [
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    # The S3 tests stub boto3 with botocore.stub.Stubber (no network).
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff.lint.per-file-ignores]
# main.py adjusts sys.path before importing the package so that
# `python signal_mcp/main.py` works without an install.
"signal_mcp/main.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["signal_mcp", "tests", "examples"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "signal_mcp.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# boto3/botocore ship no type stubs; the s3 module wraps them behind Any.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["signal_mcp"]
